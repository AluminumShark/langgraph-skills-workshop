[project]
name = "langgraph-skills-workshop"
version = "1.0.0"
description = "從 LangGraph 到 Skills：結構化與非結構化 Agent 的雙拼指南（NTU AI Club 工作坊教材）"
readme = "README.md"
requires-python = ">=3.11"
# 跟 notebook 第一格安裝的版本一致
dependencies = [
    "langgraph>=1.1,<2",
    "langchain>=1.2,<2",
    "langchain-google-genai>=4,<5",
    "langgraph-checkpoint-sqlite>=3,<4",
    # 1-B、2-E 的 MCP（兩個要一起釘，版本不配會 import 失敗）
    "mcp>=1.20,<2",
    "langchain-mcp-adapters>=0.3,<0.4",
]

[dependency-groups]
# 講師在本機產生、驗證 notebook 用；學生不需要
dev = [
    "nbformat>=5.10",
    "nbclient>=0.10",
    "ipykernel>=6.29",
    # 2-E 把小助教包成 API 服務用（Colab 由 notebook 第一格安裝）
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.31",
]

[tool.uv]
package = false
